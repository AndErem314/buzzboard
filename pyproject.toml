[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buzzboard"
version = "0.1.0"
description = "Multi-agent beehive inspection assistant — voice memo → structured Obsidian notes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Andrey", email = "andrey@example.com"}
]
keywords = ["beekeeping", "multi-agent", "llm", "whisper", "obsidian", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]
ollama = [
    "ollama>=0.4",
]
whisper = [
    "openai-whisper>=20231117",
]
all = [
    "buzzboard[dev,ollama,whisper]",
]

[project.scripts]
buzzboard = "src.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
